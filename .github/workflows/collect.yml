name: Collect traffic

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run collector
        env:
          TOMTOM_KEY: ${{ secrets.TOMTOM_KEY }}
        run: python3 collect.py
      - name: Save data
        run: |
          git config user.name "traffic-bot"
          git config user.email "traffic-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Add readings" && git push)
